name: Elenco Finlandia

on:
  schedule:
    - cron: '53 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Rifà l'elenco dei distributori della Finlandia da OpenStreetMap
        run: node .github/scripts/carburanti-finlandia.js
      - name: Salva il file aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/carburanti-finlandia.json
          git diff --cached --quiet || (git commit -m "Elenco Finlandia aggiornato" && git pull --rebase && git push)
