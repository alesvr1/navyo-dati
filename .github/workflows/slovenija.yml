name: Slovenia prezzi

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Scarica distributori e prezzi da goriva.si
        run: node .github/scripts/slovenija.js
      - name: Salva il file aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/slovenija.json
          git diff --cached --quiet || (git commit -m "Slovenia prezzi aggiornati" && git pull --rebase && git push)
