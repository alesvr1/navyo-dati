name: Svezia prezzi

on:
  schedule:
    - cron: '29 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Scarica i distributori della Svezia con i prezzi
        run: node .github/scripts/svezia-prezzi.js
      - name: Salva il file aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/svezia.json
          git diff --cached --quiet || (git commit -m "Svezia prezzi aggiornati" && git pull --rebase && git push)
