name: Prezzi Finlandia

on:
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Legge i prezzi da polttoaine.net
        run: node .github/scripts/prezzi-finlandia.js
      - name: Salva i file aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/prezzi-finlandia.json dati/coordinate-polttoaine.json
          git diff --cached --quiet || (git commit -m "Prezzi Finlandia aggiornati" && git push)
